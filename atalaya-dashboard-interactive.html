<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atalaya Dashboard - Interactive Monitoring</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
      color: #fff;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    .header {
      text-align: center; margin-bottom: 40px;
      animation: fadeInDown 0.6s ease-out;
    }

    h1 {
      font-size: 48px; margin-bottom: 10px;
      background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .subtitle {
      font-size: 16px; color: #94a3b8;
      margin-bottom: 20px;
    }

    .status-bar {
      display: flex; justify-content: center; gap: 20px; margin-top: 20px;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: rgba(255,255,255,0.05); border-radius: 20px;
      border: 1px solid rgba(6,182,212,0.3);
      font-size: 13px;
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.active { background: #16a34a; }
    .status-dot.warning { background: #f59e0b; }
    .status-dot.critical { background: #ef4444; }

    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }

    .diagram-container {
      background: white; border-radius: 16px; padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeInLeft 0.6s ease-out 0.2s both;
    }

    .controls-panel {
      background: rgba(255,255,255,0.05); border-radius: 16px; padding: 30px;
      border: 1px solid rgba(6,182,212,0.2);
      animation: fadeInRight 0.6s ease-out 0.2s both;
    }

    .control-group { margin-bottom: 30px; }
    .control-group h3 { font-size: 14px; color: #06b6d4; margin-bottom: 12px; font-weight: 600; }

    .module-list {
      display: grid; grid-template-columns: 1fr; gap: 12px;
    }

    .module-button {
      padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05); color: #e2e8f0;
      cursor: pointer; transition: all 0.3s ease;
      text-align: left; font-size: 13px; font-weight: 500;
      display: flex; justify-content: space-between; align-items: center;
    }

    .module-button:hover {
      background: rgba(255,255,255,0.1); border-color: rgba(6,182,212,0.5);
      transform: translateX(4px);
    }

    .module-button.active {
      background: linear-gradient(135deg, rgba(6,182,212,0.3), rgba(59,130,246,0.3));
      border-color: #06b6d4; color: #06b6d4;
    }

    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600;
    }

    .badge-active { background: rgba(22,163,74,0.2); color: #16a34a; }
    .badge-idle { background: rgba(100,116,139,0.2); color: #94a3b8; }

    svg { display: block; width: 100%; height: auto; }

    .module-rect {
      cursor: pointer; transition: all 0.3s ease;
      filter: drop-shadow(0 0 0 transparent);
    }

    .module-rect:hover {
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.3));
      stroke-width: 3;
    }

    .module-rect.active {
      filter: drop-shadow(0 0 16px currentColor);
      stroke-width: 3;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      justify-content: center; align-items: center;
      animation: fadeIn 0.3s ease;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: #1e293b; border-radius: 16px; padding: 40px;
      max-width: 500px; width: 90%; border: 1px solid rgba(6,182,212,0.3);
      animation: slideUp 0.4s ease;
    }

    .modal h2 { font-size: 24px; margin-bottom: 16px; color: #06b6d4; }
    .modal-stat { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
    .stat-box {
      background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;
      border: 1px solid rgba(6,182,212,0.2);
    }

    .stat-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #06b6d4; }

    .progress-bar {
      width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px;
      margin-top: 12px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #06b6d4, #3b82f6);
      border-radius: 3px; transition: width 0.5s ease;
    }

    .close-modal {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255,255,255,0.1); border: none; color: white;
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      font-size: 20px; transition: all 0.3s ease;
    }

    .close-modal:hover {
      background: rgba(255,255,255,0.2); transform: rotate(90deg);
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      50% { filter: drop-shadow(0 0 8px rgba(6,182,212,0.6)); }
    }

    .module-rect.pulse {
      animation: glow 2s ease-in-out infinite;
    }

    @media (max-width: 1024px) {
      .main-grid { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚔️ Atalaya Dashboard</h1>
      <p class="subtitle">Real-time monitoring of Claude Code mods ecosystem</p>
      <div class="status-bar">
        <div class="status-item">
          <div class="status-dot active"></div>
          <span>6 mods activos</span>
        </div>
        <div class="status-item">
          <div class="status-dot active"></div>
          <span id="liveStatus">4 tools corriendo</span>
        </div>
        <div class="status-item">
          <div class="status-dot warning"></div>
          <span id="tokenStatus">Semana al 82%</span>
        </div>
      </div>
    </div>

    <div class="main-grid">
      <!-- Diagram -->
      <div class="diagram-container">
        <svg id="diagramSvg" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
            </pattern>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <rect width="1200" height="700" fill="url(#grid)" opacity="0.3"/>

          <!-- Central Hub -->
          <circle cx="600" cy="350" r="80" fill="#1e293b" stroke="#06b6d4" stroke-width="3" class="pulse"/>
          <circle cx="600" cy="350" r="70" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
          <text x="600" y="345" text-anchor="middle" font-size="48" fill="#06b6d4">⚔️</text>
          <text x="600" y="385" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">CENTRO</text>

          <!-- Connection Lines -->
          <line x1="600" y1="350" x2="200" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
          <line x1="600" y1="350" x2="600" y2="130" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
          <line x1="600" y1="350" x2="1000" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
          <line x1="600" y1="350" x2="200" y2="550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
          <line x1="600" y1="350" x2="600" y2="570" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
          <line x1="600" y1="350" x2="1000" y2="550" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

          <!-- Modules -->
          <rect id="mod-token" class="module-rect" x="120" y="80" width="160" height="140" rx="12" fill="#ecf0ff" stroke="#06b6d4" stroke-width="2" data-module="token-budget"/>
          <rect x="130" y="90" width="140" height="30" rx="6" fill="#06b6d4" opacity="0.1"/>
          <text x="200" y="112" text-anchor="middle" font-size="32">💰</text>
          <text x="200" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">token-budget</text>
          <rect x="135" y="155" width="130" height="4" rx="2" fill="#e0e7ff"/>
          <rect class="progress-fill" x="135" y="155" width="78" height="4" rx="2" fill="#06b6d4"/>
          <text class="usage-pct" x="200" y="175" text-anchor="middle" font-size="11" fill="#64748b">60% semanal</text>

          <rect id="mod-agent" class="module-rect" x="520" y="40" width="160" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" data-module="agent-panel"/>
          <rect x="530" y="50" width="140" height="30" rx="6" fill="#16a34a" opacity="0.1"/>
          <text x="600" y="72" text-anchor="middle" font-size="32">👥</text>
          <text x="600" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">agent-panel</text>
          <circle cx="555" cy="125" r="4" fill="#16a34a"/>
          <circle cx="575" cy="125" r="4" fill="#16a34a"/>
          <circle cx="595" cy="125" r="4" fill="#16a34a"/>
          <circle cx="615" cy="125" r="4" fill="#16a34a"/>
          <text class="tools-count" x="600" y="145" text-anchor="middle" font-size="11" fill="#64748b">4 activos</text>

          <rect id="mod-model" class="module-rect" x="920" y="80" width="160" height="140" rx="12" fill="#fef2f8" stroke="#d946ef" stroke-width="2" data-module="model-advisor"/>
          <rect x="930" y="90" width="140" height="30" rx="6" fill="#d946ef" opacity="0.1"/>
          <text x="1000" y="112" text-anchor="middle" font-size="32">🧠</text>
          <text x="1000" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#be123c">model-advisor</text>
          <rect x="935" y="155" width="130" height="4" rx="2" fill="#f5d4e6"/>
          <rect class="progress-fill" x="935" y="155" width="65" height="4" rx="2" fill="#d946ef"/>
          <text x="1000" y="175" text-anchor="middle" font-size="11" fill="#64748b">Haiku activo</text>

          <rect id="mod-plan" class="module-rect" x="120" y="480" width="160" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" data-module="plan-build"/>
          <rect x="130" y="490" width="140" height="30" rx="6" fill="#2563eb" opacity="0.1"/>
          <text x="200" y="512" text-anchor="middle" font-size="32">🔨</text>
          <text x="200" y="540" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">plan-build</text>
          <text x="200" y="560" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="600">📋 → 🔨</text>
          <text class="stage-text" x="200" y="575" text-anchor="middle" font-size="11" fill="#64748b">Esperando tarea</text>

          <rect id="mod-graphify" class="module-rect" x="520" y="520" width="160" height="140" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2" data-module="graphify-panel"/>
          <rect x="530" y="530" width="140" height="30" rx="6" fill="#9333ea" opacity="0.1"/>
          <text x="600" y="552" text-anchor="middle" font-size="32">📈</text>
          <text x="600" y="580" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">graphify-panel</text>
          <circle cx="575" cy="620" r="3" fill="#9333ea"/>
          <circle cx="600" cy="610" r="3" fill="#9333ea"/>
          <circle cx="625" cy="620" r="3" fill="#9333ea"/>
          <line x1="575" y1="620" x2="600" y2="610" stroke="#9333ea" stroke-width="1.5" opacity="0.6"/>
          <line x1="600" y1="610" x2="625" y2="620" stroke="#9333ea" stroke-width="1.5" opacity="0.6"/>

          <rect id="mod-dashboard" class="module-rect" x="920" y="480" width="160" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" data-module="atalaya-dashboard"/>
          <rect x="930" y="490" width="140" height="30" rx="6" fill="#ea580c" opacity="0.1"/>
          <text x="1000" y="512" text-anchor="middle" font-size="32">⚔️</text>
          <text x="1000" y="540" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">dashboard</text>
          <rect x="935" y="560" width="130" height="2" rx="1" fill="#fed7aa"/>
          <rect x="935" y="565" width="130" height="2" rx="1" fill="#fed7aa"/>
          <rect x="935" y="570" width="130" height="2" rx="1" fill="#fed7aa"/>
          <text x="1000" y="590" text-anchor="middle" font-size="11" fill="#64748b">Hub central</text>
        </svg>
      </div>

      <!-- Controls Panel -->
      <div class="controls-panel">
        <div class="control-group">
          <h3>📊 Módulos Activos</h3>
          <div class="module-list" id="moduleList">
            <!-- Will be populated by JS -->
          </div>
        </div>

        <div class="control-group">
          <h3>⚡ Acciones Rápidas</h3>
          <button class="module-button" onclick="simulateUpdate()">
            🔄 Actualizar datos
          </button>
          <button class="module-button" onclick="toggleAnimation()">
            ✨ Toggle animaciones
          </button>
        </div>

        <div class="control-group">
          <h3>🔍 Detalles Seleccionado</h3>
          <div id="selectedInfo" style="font-size: 13px; color: #94a3b8; line-height: 1.6;">
            Haz click en un módulo para ver detalles
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <h2 id="modalTitle">Módulo</h2>
      <p id="modalDesc" style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;"></p>

      <div class="modal-stat">
        <div class="stat-box">
          <div class="stat-label" id="stat1Label">Estado</div>
          <div class="stat-value" id="stat1Value">--</div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="stat2Label">Uso</div>
          <div class="stat-value" id="stat2Value">--</div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Progreso</div>
        <div class="progress-bar">
          <div id="modalProgressBar" class="progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <button id="commandBtn" class="module-button" style="margin-top: 20px; width: 100%; justify-content: center; background: linear-gradient(135deg, rgba(6,182,212,0.3), rgba(59,130,246,0.3)); border-color: #06b6d4; color: #06b6d4; font-weight: 600;" onclick="executeCommand()">
        📋 Copiar comando
      </button>
      <div id="copyNotification" style="margin-top: 12px; padding: 8px; background: rgba(22,163,74,0.2); border: 1px solid #16a34a; border-radius: 6px; color: #16a34a; font-size: 12px; text-align: center; display: none;">
        ✅ Comando copiado al portapapeles
      </div>
    </div>
  </div>

  <script>
    // Module data
    const modules = {
      'token-budget': {
        emoji: '💰',
        name: 'token-budget',
        description: 'Monitoreo de límites de tokens en tiempo real',
        status: 'Activo',
        usage: '60%',
        progress: 60,
        command: '/No tiene comando'
      },
      'agent-panel': {
        emoji: '👥',
        name: 'agent-panel',
        description: 'Panel en vivo de tools y subagentes',
        status: 'Corriendo',
        usage: '4 tools',
        progress: 100,
        command: '/agent-panel'
      },
      'model-advisor': {
        emoji: '🧠',
        name: 'model-advisor',
        description: 'Sugiere modelos más baratos automáticamente',
        status: 'Activo',
        usage: 'Haiku',
        progress: 50,
        command: '/No tiene comando'
      },
      'plan-build': {
        emoji: '🔨',
        name: 'plan-build',
        description: 'Planificador y constructor automático de tareas',
        status: 'Esperando',
        usage: '0',
        progress: 0,
        command: '/plan-build <tarea>'
      },
      'graphify-panel': {
        emoji: '📈',
        name: 'graphify-panel',
        description: 'Visualización del grafo del proyecto',
        status: 'Listo',
        usage: '42 nodos',
        progress: 85,
        command: '/graphify-panel'
      },
      'atalaya-dashboard': {
        emoji: '⚔️',
        name: 'atalaya-dashboard',
        description: 'Centro de control de todos los mods',
        status: 'Activo',
        usage: '6/6 mods',
        progress: 100,
        command: '/atalaya'
      }
    }

    let selectedModule = null
    let animationEnabled = true

    // Initialize
    function init() {
      populateModuleList()
      attachModuleListeners()
      updateLiveStatus()
      setInterval(updateLiveStatus, 5000)
    }

    function populateModuleList() {
      const list = document.getElementById('moduleList')
      Object.keys(modules).forEach(key => {
        const mod = modules[key]
        const btn = document.createElement('button')
        btn.className = 'module-button'
        btn.innerHTML = `
          <span>${mod.emoji} ${mod.name}</span>
          <span class="status-badge badge-active">${mod.status}</span>
        `
        btn.onclick = () => selectModule(key)
        list.appendChild(btn)
      })
    }

    function attachModuleListeners() {
      const rects = document.querySelectorAll('.module-rect')
      rects.forEach(rect => {
        rect.addEventListener('click', function() {
          const moduleName = this.getAttribute('data-module')
          selectModule(moduleName)
        })
        rect.addEventListener('mouseenter', function() {
          this.style.strokeWidth = '3'
        })
        rect.addEventListener('mouseleave', function() {
          if (selectedModule !== this.getAttribute('data-module')) {
            this.style.strokeWidth = '2'
          }
        })
      })
    }

    function selectModule(moduleName) {
      selectedModule = moduleName
      const mod = modules[moduleName]

      // Update UI
      document.querySelectorAll('.module-rect').forEach(rect => {
        rect.classList.remove('active')
        if (rect.getAttribute('data-module') === moduleName) {
          rect.classList.add('active')
        }
      })

      document.querySelectorAll('.module-button').forEach(btn => {
        btn.classList.remove('active')
        if (btn.textContent.includes(moduleName)) {
          btn.classList.add('active')
        }
      })

      // Update selected info
      document.getElementById('selectedInfo').innerHTML = `
        <strong style="color: #06b6d4;">${mod.emoji} ${mod.name}</strong><br>
        ${mod.description}<br><br>
        <strong>Estado:</strong> ${mod.status}<br>
        <strong>Uso:</strong> ${mod.usage}<br>
        <strong>Comando:</strong> <code style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px;">${mod.command}</code>
      `

      // Show modal
      showModal(moduleName)
    }

    function showModal(moduleName) {
      const mod = modules[moduleName]
      document.getElementById('modalTitle').textContent = `${mod.emoji} ${mod.name}`
      document.getElementById('modalDesc').textContent = mod.description
      document.getElementById('stat1Label').textContent = 'Estado'
      document.getElementById('stat1Value').textContent = mod.status
      document.getElementById('stat2Label').textContent = 'Uso'
      document.getElementById('stat2Value').textContent = mod.usage
      document.getElementById('modalProgressBar').style.width = mod.progress + '%'
      document.getElementById('modal').classList.add('active')
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active')
    }

    function executeCommand() {
      const cmd = modules[selectedModule].command

      // Copiar al portapapeles
      navigator.clipboard.writeText(cmd).then(() => {
        // Show success notification
        const notification = document.getElementById('copyNotification')
        notification.style.display = 'block'

        // Auto-hide after 2 seconds
        setTimeout(() => {
          notification.style.display = 'none'
        }, 2000)

        // Update button text
        const btn = document.getElementById('commandBtn')
        const originalText = btn.innerHTML
        btn.innerHTML = '✅ Copiado!'
        btn.style.background = 'linear-gradient(135deg, rgba(22,163,74,0.3), rgba(34,197,94,0.3))'
        btn.style.borderColor = '#16a34a'
        btn.style.color = '#16a34a'

        setTimeout(() => {
          btn.innerHTML = originalText
          btn.style.background = 'linear-gradient(135deg, rgba(6,182,212,0.3), rgba(59,130,246,0.3))'
          btn.style.borderColor = '#06b6d4'
          btn.style.color = '#06b6d4'
        }, 2000)
      }).catch(err => {
        // Fallback for browsers that don't support clipboard API
        const textArea = document.createElement('textarea')
        textArea.value = cmd
        document.body.appendChild(textArea)
        textArea.select()
        document.execCommand('copy')
        document.body.removeChild(textArea)
        alert(`✅ Comando copiado:\n\n${cmd}\n\nPégalo en Claude Code`)
      })
    }

    function simulateUpdate() {
      // Simulate live data update
      const keys = Object.keys(modules)
      keys.forEach(key => {
        const usage = Math.floor(Math.random() * 100)
        modules[key].progress = usage
      })

      // Update SVG progress bars
      document.querySelectorAll('.progress-fill').forEach((fill, idx) => {
        fill.style.width = modules[keys[idx]].progress + '%'
      })

      alert('✅ Datos actualizados (simulado)')
      if (selectedModule) selectModule(selectedModule)
    }

    function toggleAnimation() {
      animationEnabled = !animationEnabled
      document.querySelectorAll('.pulse').forEach(el => {
        if (animationEnabled) {
          el.style.animation = 'glow 2s ease-in-out infinite'
        } else {
          el.style.animation = 'none'
        }
      })
    }

    function updateLiveStatus() {
      const agents = Math.floor(Math.random() * 8) + 1
      const week = Math.floor(Math.random() * 30) + 60
      document.getElementById('liveStatus').textContent = `${agents} tools corriendo`
      document.getElementById('tokenStatus').textContent = `Semana al ${week}%`
    }

    // Close modal with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal()
    })

    // Start
    init()
  </script>
</body>
</html>
